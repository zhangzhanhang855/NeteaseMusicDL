<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>网易云音乐解析控制台 Pro</title>
    
    <!-- 基础样式库与播放器 -->
    <link href="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/aplayer/1.10.1/APlayer.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", Roboto, sans-serif;
            --bg-primary: #0d0e15;
            --bg-secondary: #161824;
            --bg-surface: rgba(26, 29, 45, 0.72);
            --bg-surface-hover: rgba(38, 42, 65, 0.85);
            --bg-glass-card: rgba(22, 24, 38, 0.75);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(234, 46, 73, 0.5);
            --text-main: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-color: #ea2e49;
            --accent-gradient: linear-gradient(135deg, #ea2e49 0%, #ff5858 100%);
            --accent-glow: rgba(234, 46, 73, 0.35);
            --blur-val: 20px;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --transition-smooth: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-subtle: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
            --shadow-float: 0 12px 35px -4px rgba(0, 0, 0, 0.6);
        }

        [data-theme="light"] {
            --bg-primary: #f5f6fa;
            --bg-secondary: #ffffff;
            --bg-surface: rgba(255, 255, 255, 0.82);
            --bg-surface-hover: rgba(243, 244, 246, 0.9);
            --bg-glass-card: rgba(255, 255, 255, 0.85);
            --border-subtle: rgba(0, 0, 0, 0.06);
            --border-focus: rgba(234, 46, 73, 0.3);
            --text-main: #1f2937;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --shadow-subtle: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            --shadow-float: 0 12px 35px -4px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            position: relative;
            transition: var(--transition-smooth);
        }

        /* 动态氛围背景光晕 */
        body::before, body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.18;
            pointer-events: none;
            animation: pulseGlow 14s infinite alternate ease-in-out;
        }
        body::before {
            background: #ea2e49;
            top: -100px;
            left: -80px;
        }
        body::after {
            background: #3b82f6;
            bottom: -80px;
            right: -80px;
            animation-delay: -6s;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.15) translate(30px, 40px); }
            100% { transform: scale(0.9) translate(-20px, 20px); }
        }

        .container-master {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 80px 20px;
        }

        /* 顶部导航与品牌标头 */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .brand-logo-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .brand-icon {
            width: 46px;
            height: 46px;
            background: var(--accent-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .brand-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0;
            background: linear-gradient(135deg, var(--text-main) 60%, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .theme-toggle-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }
        .theme-toggle-btn:hover {
            background: var(--bg-surface-hover);
            transform: rotate(20deg);
        }

        /* 主容器面板卡片 */
        .glass-panel {
            background: var(--bg-glass-card);
            backdrop-filter: blur(var(--blur-val));
            -webkit-backdrop-filter: blur(var(--blur-val));
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-subtle);
            padding: 30px;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .glass-panel:hover {
            box-shadow: var(--shadow-float);
        }

        /* 标签导航栏（拟态切换器） */
        .tab-selector-wrapper {
            display: flex;
            background: rgba(0, 0, 0, 0.15);
            padding: 6px;
            border-radius: var(--radius-md);
            margin-bottom: 28px;
            border: 1px solid var(--border-subtle);
            gap: 6px;
            overflow-x: auto;
        }
        .tab-btn {
            flex: 1;
            min-width: 90px;
            text-align: center;
            padding: 10px 14px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }
        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
        }
        .tab-btn.active {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* 表单与输入框 */
        .form-label-custom {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-group-custom {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group-custom input,
        .input-group-custom select {
            width: 100%;
            height: 48px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            padding: 0 16px;
            font-size: 14px;
            outline: none;
            transition: var(--transition-smooth);
        }
        .input-group-custom input:focus,
        .input-group-custom select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(234, 46, 73, 0.12);
            background: var(--bg-surface-hover);
        }
        .input-group-custom input::placeholder {
            color: var(--text-muted);
        }
        .input-group-custom select option {
            background: var(--bg-secondary);
            color: var(--text-main);
        }

        /* 统一响应式提交按钮 */
        .btn-action-glow {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition-smooth);
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 6px 18px var(--accent-glow);
            position: relative;
            overflow: hidden;
        }
        .btn-action-glow:hover {
            opacity: 0.94;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }
        .btn-action-glow:active {
            transform: translateY(0);
        }
        .btn-action-glow:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* 列表容器美化 */
        .media-track-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .track-item {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition-smooth);
            gap: 15px;
        }
        .track-item:hover {
            background: var(--bg-surface-hover);
            border-color: rgba(255, 255, 255, 0.14);
            transform: translateX(3px);
        }
        .track-avatar {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .track-meta {
            flex-grow: 1;
            min-width: 0;
        }
        .track-name-main {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
            margin-bottom: 2px;
        }
        .track-sub-desc {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .track-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-chip {
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 20px;
            border: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition-smooth);
        }
        .btn-chip:hover {
            background: var(--accent-gradient);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 10px var(--accent-glow);
        }
        .btn-chip-success {
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.25);
        }
        .btn-chip-success:hover {
            background: #10b981;
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.35);
        }

        /* 歌曲单曲解析详情卡片 */
        .song-detail-card {
            background: var(--bg-glass-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px;
            position: relative;
            box-shadow: var(--shadow-float);
        }
        .detail-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 18px 0;
        }
        .meta-pill {
            background: var(--bg-surface);
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .meta-pill-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }
        .meta-pill-val {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 歌词视窗滚动器 */
        .lyrics-viewport {
            height: 220px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.25);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            padding: 16px 20px;
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 2;
            text-align: center;
            scroll-behavior: smooth;
        }
        .lyrics-viewport::-webkit-scrollbar {
            width: 4px;
        }
        .lyrics-viewport::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 4px;
        }

        /* 专辑与歌单头部视差面板 */
        .collection-hero {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .collection-avatar {
            width: 90px;
            height: 90px;
            border-radius: var(--radius-md);
            object-fit: cover;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }
        .collection-info-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-main);
        }
        .collection-info-sub {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .collection-desc-box {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
            max-height: 48px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* APlayer 深色模式覆写适配 */
        .aplayer {
            background: var(--bg-surface) !important;
            border-radius: var(--radius-md) !important;
            border: 1px solid var(--border-subtle) !important;
            box-shadow: none !important;
            margin: 15px 0 0 0 !important;
            font-family: var(--font-sans) !important;
        }
        .aplayer .aplayer-info {
            border-bottom: none !important;
        }
        .aplayer .aplayer-title {
            color: var(--text-main) !important;
        }
        .aplayer .aplayer-author {
            color: var(--text-muted) !important;
        }

        /* 模态框与Toast定制 */
        .modal-content-glass {
            background: var(--bg-glass-card);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            color: var(--text-main);
        }
        .modal-header-custom {
            border-bottom: 1px solid var(--border-subtle);
            padding: 18px 24px;
        }
        .toast-system-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast-node {
            background: var(--bg-surface-hover);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-size: 14px;
            box-shadow: var(--shadow-float);
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(120%);
            transition: transform 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            pointer-events: auto;
        }
        .toast-node.show {
            transform: translateX(0);
        }

        /* 进度条动画 */
        .progress-indicator-custom {
            height: 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-bar-glow {
            width: 100%;
            height: 100%;
            background: var(--accent-gradient);
            box-shadow: 0 0 10px var(--accent-glow);
            animation: indetScan 1.6s infinite ease-in-out;
            transform-origin: 0% 50%;
        }
        @keyframes indetScan {
            0% { transform: scaleX(0.05) translateX(-10%); }
            50% { transform: scaleX(0.75) translateX(30%); }
            100% { transform: scaleX(0.1) translateX(110%); }
        }

        /* 隐藏原生无障碍隐藏元素 */
        .hidden-accessible {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="toast-system-container" id="toastContainer"></div>

    <div class="container-master">
        <!-- 头部顶栏 -->
        <header class="brand-header">
            <div class="brand-logo-wrap">
                <div class="brand-icon">
                    <i class="fa-solid fa-music"></i>
                </div>
                <div>
                    <h1 class="brand-title">网易云音乐工具箱</h1>
                    <p class="brand-subtitle">Music Cloud Engine Pro</p>
                </div>
            </div>
            <button class="theme-toggle-btn" id="themeToggleBtn" title="切换暗色/亮色">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <!-- 主操作面板 -->
        <div class="glass-panel">
            <form id="main-form" onsubmit="return false;">
                <!-- 拟态滑动标签栏 -->
                <div class="tab-selector-wrapper">
                    <button type="button" class="tab-btn active" data-target="search">
                        <i class="fa-solid fa-magnifying-glass"></i>歌曲搜索
                    </button>
                    <button type="button" class="tab-btn" data-target="parse">
                        <i class="fa-solid fa-bolt"></i>单曲解析
                    </button>
                    <button type="button" class="tab-btn" data-target="playlist">
                        <i class="fa-solid fa-list-ul"></i>歌单解析
                    </button>
                    <button type="button" class="tab-btn" data-target="album">
                        <i class="fa-solid fa-compact-disc"></i>专辑解析
                    </button>
                    <button type="button" class="tab-btn" data-target="download">
                        <i class="fa-solid fa-cloud-arrow-down"></i>音乐下载
                    </button>
                </div>

                <!-- 隐藏的旧式Select控制组件，保持原有jQuery事件驱动无损运作 -->
                <select id="mode-select" class="hidden-accessible">
                    <option value="search" selected>歌曲搜索</option>
                    <option value="parse">单曲解析</option>
                    <option value="playlist">歌单解析</option>
                    <option value="album">专辑解析</option>
                    <option value="download">音乐下载</option>
                </select>

                <!-- 1. 搜索区域 -->
                <div id="search-area">
                    <div class="input-group-custom">
                        <label class="form-label-custom" for="search_keywords">
                            <i class="fa-solid fa-keyboard"></i> 搜索关键词
                        </label>
                        <input type="text" id="search_keywords" placeholder="输入歌手名、歌名、或者组合关键词...">
                    </div>
                    <div class="input-group-custom">
                        <label class="form-label-custom" for="search_limit">
                            <i class="fa-solid fa-list-ol"></i> 返回检索数量 (1 - 50)
                        </label>
                        <input type="number" id="search_limit" value="10" min="1" max="50">
                    </div>
                    <button type="button" id="search-btn" class="btn-action-glow">
                        <i class="fa-solid fa-magnifying-glass"></i> 执行聚合搜索
                    </button>
                </div>

                <!-- 2. 单曲解析区域 -->
                <div id="parse-area" style="display:none;">
                    <div class="input-group-custom">
                        <label class="form-label-custom" for="song_ids">
                            <i class="fa-solid fa-link"></i> 歌曲 ID 或 URL 直链
                        </label>
                        <input type="text" id="song_ids" placeholder="例如：185668 或粘贴完整分享链接...">
                    </div>
                    <div class="input-group-custom">
                        <label class="form-label-custom" for="level">
                            <i class="fa-solid fa-sliders"></i> 解析音质规格
                        </label>
                        <select id="level">
                            <option value="standard">标准音质 (128kbps)</option>
                            <option value="exhigh">极高音质 (320kbps)</option>
                            <option value="lossless">无损音质 (FLAC)</option>
                            <option value="hires">Hi-Res 高解析 (24bit/96kHz)</option>
                            <option value="sky">沉浸环绕声</option>
                            <option value="jyeffect">高清环绕声</option>
                            <option value="jymaster">超清母带</option>
                            <option value="dolby">杜比全景声 (Dolby Atmos)</option>
                        </select>
                    </div>
                    <button type="button" id="parse-btn" class="btn-action-glow">
                        <i class="fa-solid fa-bolt"></i> 即刻极速解析
                    </button>
                </div>

                <!-- 3. 歌单解析区域 -->
                <div id="playlist-area" style="display:none;">
                    <div class="input-group-custom">
                        <label class="form-label-custom" for="playlist_id">
                            <i class="fa-solid fa-table-list"></i> 歌单 ID 或分享链接
                        </label>
                        <input type="text" id="playlist_id" placeholder="输入网易云歌单 ID 或完整网页 URL...">
                    </div>
                    <button type="button" id="playlist-btn" class="btn-action-glow">
                        <i class="fa-solid fa-list-check"></i> 解析并提取全量歌单
                    </button>
                </div>

                <!-- 4. 专辑解析区域 -->
                <div id="album-area" style="display:none;">
                    <div class="input-group-custom">
                        <label class="form-label-custom" for="album_id">
                            <i class="fa-solid fa-record-vinyl"></i> 专辑 ID 或分享链接
                        </label>
                        <input type="text" id="album_id" placeholder="输入专辑 ID 或完整分享网页 URL...">
                    </div>
                    <button type="button" id="album-btn" class="btn-action-glow">

    <!-- 核心驱动脚本库 -->
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/aplayer/1.10.1/APlayer.min.js"></script>
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>

    <script>
        // 轻量全局 Toast 通知增强系统
        function showNotification(msg, type = 'info') {
            const iconMap = {
                info: 'fa-circle-info',
                success: 'fa-circle-check text-success',
                warning: 'fa-triangle-exclamation text-warning',
                error: 'fa-circle-xmark text-danger'
            };
            const icon = iconMap[type] || iconMap.info;
            const toast = $(`<div class="toast-node"><i class="fa-solid ${icon}"></i><span>${msg}</span></div>`);
            $('#toastContainer').append(toast);
            setTimeout(() => toast.addClass('show'), 20);
            setTimeout(() => {
                toast.removeClass('show');
                setTimeout(() => toast.remove(), 400);
            }, 3600);
        }

        // 重写原生弹窗提供更具一体感的视觉反馈
        window.alert = function(msg) {
            let toastType = 'info';
            if (msg.indexOf('失败') !== -1 || msg.indexOf('错') !== -1) toastType = 'error';
            if (msg.indexOf('完成') !== -1 || msg.indexOf('成功') !== -1) toastType = 'success';
            showNotification(msg, toastType);
        };

        $(document).ready(function() {
            // 亮/暗主题无感切换
            $('#themeToggleBtn').on('click', function() {
                const currentTheme = $('html').attr('data-theme');
                const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
                $('html').attr('data-theme', nextTheme);
                $(this).find('i').toggleClass('fa-moon fa-sun');
            });

            // 选项卡与旧 select 同步无损驱动
            $('.tab-btn').on('click', function() {
                const target = $(this).data('target');
                $('.tab-btn').removeClass('active');
                $(this).addClass('active');
                $('#mode-select').val(target).trigger('change');
            });

            // 原逻辑保持：歌词解析与对齐算法
            function lrctrim(lyrics) {
                const lines = lyrics.split('\n');
                const data = [];
                lines.forEach((line, index) => {
                    const matches = line.match(/\[(\d{2}):(\d{2}[\.:]?\d*)]/);
                    if (matches) {
                        const minutes = parseInt(matches[1], 10);
                        const seconds = parseFloat(matches[2].replace('.', ':')) || 0;
                        const timestamp = minutes * 60000 + seconds * 1000;
                        let text = line.replace(/\[\d{2}:\d{2}[\.:]?\d*\]/g, '').trim();
                        text = text.replace(/\s\s+/g, ' ');
                        data.push([timestamp, index, text]);
                    }
                });
                data.sort((a, b) => a[0] - b[0]);
                return data;
            }

            function lrctran(lyric, tlyric) {
                lyric = lrctrim(lyric);
                tlyric = lrctrim(tlyric);
                let len1 = lyric.length;
                let len2 = tlyric.length;
                let result = "";

                for (let i = 0, j = 0; i < len1 && j < len2; i++) {
                    while (lyric[i][0] > tlyric[j][0] && j + 1 < len2) {
                        j++;
                    }
                    if (lyric[i][0] === tlyric[j][0]) {
                        tlyric[j][2] = tlyric[j][2].replace('/', '');
                        if (tlyric[j][2]) {
                            lyric[i][2] += ` (翻译：${tlyric[j][2]})`;
                        }
                        j++;
                    }
                }

                for (let i = 0; i < len1; i++) {
                    let t = lyric[i][0];
                    result += `[${String(Math.floor(t / 60000)).padStart(2, '0')}:${String(Math.floor((t % 60000) / 1000)).padStart(2, '0')}.${String(t % 1000).padStart(3, '0')}]${lyric[i][2]}\n`;
                }
                return result;
            }

            function extractLinks(text) {
                var regex = /https?:\/\/\S+/g;
                var matches = text.match(regex);
                return matches ? matches[0] : '';
            }
    
            function checkValidLink(link) {
                if (link.indexOf("http") === -1 || 
                    (link.indexOf("music.163.com") === -1 && link.indexOf("163cn.tv") === -1)) {
                    return false;
                }
                return true;
            }
    
            function extractAndCheckId(text) {
                var link = extractLinks(text);
                if (checkValidLink(link)) {
                    return link;
                } else {
                    var idRegex = /\b\d+\b/g;
                    var ids = text.match(idRegex);
                    if (ids && ids.length > 0) {
                        return ids[0];
                    }
                    return '';
                }
            }

            // 切换功能区（原有逻辑映射）
            $('#mode-select').on('change', function() {
                const val = $(this).val();
                $(`.tab-btn[data-target="${val}"]`).addClass('active').siblings().removeClass('active');

                if (val === 'search') {
                    $('#search-area').show();
                    $('#parse-area').hide();
                    $('#playlist-area').hide();
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#song-info').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if (val === 'parse') {
                    $('#search-area').hide();
                    $('#parse-area').show();
                    $('#playlist-area').hide();
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#search-result').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if (val === 'playlist') {
                    $('#search-area').hide();
                    $('#parse-area').hide();
                    $('#playlist-area').show();
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#search-result').addClass('d-none');
                    $('#song-info').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if (val === 'album') {
                    $('#search-area').hide();
                    $('#parse-area').hide();
                    $('#playlist-area').hide();
                    $('#album-area').show();
                    $('#download-area').hide();
                    $('#search-result').addClass('d-none');
                    $('#song-info').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                } else if (val === 'download') {
                    $('#search-area').hide();
                    $('#parse-area').hide();
                    $('#playlist-area').hide();
                    $('#album-area').hide();
                    $('#download-area').show();
                    $('#search-result').addClass('d-none');
                    $('#song-info').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                }
            });

            // 1. 歌曲搜索
            $('#search-btn').on('click', function() {
                const keywords = $('#search_keywords').val();
                const limit = $('#search_limit').val();
                if (!keywords) {
                    alert('请输入搜索关键词');
                    return;
                }
                const $btn = $(this);$btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 搜索中...');
                
                $.ajax({
                    url: '/Search',
                    method: 'POST',
                    data: { keyword: keywords, limit: limit },
                    dataType: 'json',
                    success: function(data) {
                        if (data.status === 200) {
                            $('#search-list').empty();
                            data.data.forEach(function(song) {
                                const item = `
                                <li class="track-item">
                                    <img src="${song.picUrl}" class="track-avatar" alt="cover">
                                    <div class="track-meta">
                                        <span class="track-name-main">${song.name}</span>
                                        <span class="track-sub-desc">${song.artists} &bull; [${song.album}]</span>
                                    </div>
                                    <div class="track-actions">
                                        <button class="btn-chip select-song" data-id="${song.id}" data-name="${song.name}">
                                            <i class="fa-solid fa-bolt"></i> 解析
                                        </button>
                                        <button class="btn-chip btn-chip-success download-song" data-id="${song.id}" data-name="${song.name}">
                                            <i class="fa-solid fa-download"></i> 下载
                                        </button>
                                    </div>
                                </li>`;
                                $('#search-list').append(item);
                            });
                            $('#search-result').removeClass('d-none');
                        } else {
                            $('#search-list').html('<li class="track-item text-muted">未找到相关歌曲</li>');
                            $('#search-result').removeClass('d-none');
                        }
                    },
                    error: function() {
                        $('#search-list').html('<li class="track-item text-danger">搜索失败，请重试</li>');
                        $('#search-result').removeClass('d-none');
                    },
                    complete: function() {
                        $btn.prop('disabled', false).html('<i class="fa-solid fa-magnifying-glass"></i> 执行聚合搜索');
                    }
                });
            });

            // 搜索结果点击解析联动
            $(document).on('click', '.select-song', function() {
                const songId = $(this).data('id');$('#song_ids').val(songId);
                $('#mode-select').val('parse').trigger('change');
                $('html,body').animate({scrollTop:$('#main-form').offset().top - 20}, 300);
            });

            // 2. 单曲解析
            $('#parse-btn').on('click', function() {
                const songIds = $('#song_ids').val();
                const level = $('#level').val();
                if (!songIds) {
                    alert('请输入歌曲ID或URL');
                    return;
                }
                const $btn = $(this);$btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 正在调用接口解析...');

                $.post('/Song_V1', { url: songIds, level: level, type: 'json' }, function(data) {
                    if (data.status === 200) {
                        $('#song_name').text(data.data.name);
                        $('#artist_names').text(data.data.ar_name);
                        $('#song_alname').text(data.data.al_name);
                        $('#song_level').text(data.data.level);
                        $('#song_size').text(data.data.size);

                        let processedLyrics = data.data.lyric;
                        if (data.data.tlyric) {
                            processedLyrics = lrctran(data.data.lyric, data.data.tlyric);
                        }
                        $('#lyric').html(processedLyrics.replace(/\n/g, '<br>'));
                        $('#song_url').attr('href', data.data.url).html('<i class="fa-solid fa-arrow-up-right-from-square"></i> 点击直接打开或保存音频');
                        $('#song-info').removeClass('d-none');
                        $('#show-big-pic').data('pic', data.data.pic);

                        new APlayer({
                            container: document.getElementById('aplayer'),
                            lrcType: 1,
                            theme: '#ea2e49',
                            audio: [{
                                name: data.data.name,
                                artist: data.data.ar_name,
                                url: data.data.url,
                                cover: data.data.pic,
                                lrc: processedLyrics
                            }]
                        });
                        $('html,body').animate({scrollTop:$('#song-info').offset().top - 20}, 300);
                    } else {
                        alert(data.data ? data.data.msg : '解析错误，请校验输入凭据');
                    }
                }, 'json').always(function() {
                    $btn.prop('disabled', false).html('<i class="fa-solid fa-bolt"></i> 即刻极速解析');
                });
            });

            // 大图展示
            $(document).on('click', '#show-big-pic', function() {
                var picUrl = $(this).data('pic');$('#big-pic-img').attr('src', picUrl);
                var modal = new bootstrap.Modal(document.getElementById('bigPicModal'));
                modal.show();
            });

            // 3. 歌单解析
            $('#playlist-btn').on('click', function() {
                let pid = $('#playlist_id').val().trim();
                if (!pid) {
                    alert('请输入歌单ID或链接');
                    return;
                }
                const idMatch = pid.match(/playlist\?id=(\d+)/);
                if (idMatch) pid = idMatch[1];

                const $btn = $(this);$btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 正在读取全量列表...');

                $.get('/Playlist', { id: pid }, function(data) {
                    if (data.status === 200) {
                        const pl = data.data.playlist;
                        $('#playlist-cover').attr('src', pl.coverImgUrl);
                        $('#playlist-name').text(pl.name);
                        $('#playlist-creator').text('By ' + pl.creator);
                        $('#playlist-desc').text(pl.description || '');
                        $('#playlist-count').text(pl.trackCount);
                        $('#playlist-tracks').empty();

                        pl.tracks.forEach(function(song, idx) {
                            const item = `
                            <li class="track-item">
                                <img src="${song.picUrl}" class="track-avatar" alt="cover">
                                <div class="track-meta">
                                    <span class="track-name-main">${idx+1}. ${song.name}</span>
                                    <span class="track-sub-desc">${song.artists} &bull; [${song.album}]</span>
                                </div>
                                <div class="track-actions">
                                    <button class="btn-chip select-song" data-id="${song.id}" data-name="${song.name}">
                                        <i class="fa-solid fa-bolt"></i> 解析
                                    </button>
                                    <button class="btn-chip btn-chip-success download-song" data-id="${song.id}" data-name="${song.name}">
                                        <i class="fa-solid fa-download"></i> 下载
                                    </button>
                                </div>
                            </li>`;
                            $('#playlist-tracks').append(item);
                        });
                        $('#playlist-result').removeClass('d-none');
                        $('html,body').animate({scrollTop:$('#playlist-result').offset().top - 20}, 300);
                    } else {
                        $('#playlist-result').removeClass('d-none');
                        $('#playlist-tracks').html('<li class="track-item text-danger">歌单解析失败：'+(data.data ? data.data.msg : '未知错误')+'</li>');
                    }
                }, 'json').always(function() {
                    $btn.prop('disabled', false).html('<i class="fa-solid fa-list-check"></i> 解析并提取全量歌单');
                });
            });

            // 4. 专辑解析
            $(document).on('click', '#album-btn', function() {
                let aid = $('#album_id').val().trim();
                if (!aid) {
                    alert('请输入专辑ID或链接');
                    return;
                }
                const idMatch = aid.match(/album\?id=(\d+)/);
                if (idMatch) aid = idMatch[1];

                const $btn = $(this);$btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 正在读取专辑信息...');

                $.get('/Album', { id: aid }, function(data) {
                    if (data.status === 200) {
                        const al = data.data.album;
                        $('#album-cover').attr('src', al.coverImgUrl);
                        $('#album-name').text(al.name);
                        $('#album-artist').text(al.artist);
                        $('#album-desc').text(al.description || '');
                        $('#album-count').text(al.songs.length);
                        $('#album-tracks').empty();

                        al.songs.forEach(function(song, idx) {
                            const item = `
                            <li class="track-item">
                                <img src="${song.picUrl}" class="track-avatar" alt="cover">
                                <div class="track-meta">
                                    <span class="track-name-main">${idx+1}. ${song.name}</span>
                                    <span class="track-sub-desc">${song.artists} &bull; [${song.album}]</span>
                                </div>
                                <div class="track-actions">
                                    <button class="btn-chip select-song" data-id="${song.id}" data-name="${song.name}">
                                        <i class="fa-solid fa-bolt"></i> 解析
                                    </button>
                                    <button class="btn-chip btn-chip-success download-song" data-id="${song.id}" data-name="${song.name}">
                                        <i class="fa-solid fa-download"></i> 下载
                                    </button>
                                </div>
                            </li>`;
                            $('#album-tracks').append(item);
                        });
                        $('#album-result').removeClass('d-none');
                        $('html,body').animate({scrollTop:$('#album-result').offset().top - 20}, 300);
                    } else {
                        $('#album-result').removeClass('d-none');
                        $('#album-tracks').html('<li class="track-item text-danger">专辑解析失败：'+(data.data ? data.data.msg : '未知错误')+'</li>');
                    }
                }, 'json').always(function() {
                    $btn.prop('disabled', false).html('<i class="fa-solid fa-folder-open"></i> 解析专辑轨道信息');
                });
            });

            // 5. 音乐下载功能（原有 XHR 二进制下载链路）
            $('#download-btn').on('click', function() {
                const musicId = $('#download_id').val().trim();
                const quality = $('#download_quality').val();
                
                if (!musicId) {
                    alert('请输入音乐ID或URL');
                    return;
                }
                
                let processedId = musicId;
                const idMatch = musicId.match(/song\?id=(\d+)/);
                if (idMatch) {
                    processedId = idMatch[1];
                }
                
                $('#download-progress').removeClass('d-none');
                $('#download-btn').prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 下载打包中...');
                
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/Download', true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                xhr.responseType = 'blob';
                
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        const downloadMessage = xhr.getResponseHeader('X-Download-Message');
                        const encodedFilename = xhr.getResponseHeader('X-Download-Filename');
                        const filename = encodedFilename ? decodeURIComponent(encodedFilename) : 'music.flac';
                        
                        const blob = xhr.response;
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename || 'music.flac';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                        
                        alert('✅ 音乐文件下载完成！');
                        console.log(`下载完成: ${filename}`);
                        if (downloadMessage) {
                            console.log(`服务器消息: ${downloadMessage}`);
                        }
                    } else {
                        alert('下载失败，请重试');
                    }
                    
                    $('#download-progress').addClass('d-none');
                    $('#download-btn').prop('disabled', false).html('<i class="fa-solid fa-file-arrow-down"></i> 抓取并封装下载');
                };
                
                xhr.onerror = function() {
                    alert('下载出错，请重试');
                    $('#download-progress').addClass('d-none');
                    $('#download-btn').prop('disabled', false).html('<i class="fa-solid fa-file-arrow-down"></i> 抓取并封装下载');
                };
                
                const formData = `id=${encodeURIComponent(processedId)}&quality=${encodeURIComponent(quality)}`;
                xhr.send(formData);
            });

            // 列表下载按钮跳转联动
            $(document).on('click', '.download-song', function() {
                const musicId = $(this).data('id');
                if (!musicId) {
                    alert('无法获取音乐ID');
                    return;
                }
                $('#download_id').val(musicId);
                $('#mode-select').val('download').trigger('change');
                $('html,body').animate({scrollTop:$('#main-form').offset().top - 20}, 300);
            });
        });
    </script>
</body>
</html>
