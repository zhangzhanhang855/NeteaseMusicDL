<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐工具箱 - NextGen Studio</title>
    <!-- Stylesheets -->
    <link href="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/aplayer/1.10.1/APlayer.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #e11d48 0%, #be123c 50%, #881337 100%);
            --accent-glow: rgba(225, 29, 72, 0.35);
            --bg-base: #0b0f19;
            --bg-surface: rgba(18, 24, 38, 0.72);
            --bg-card: rgba(24, 32, 51, 0.65);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-active: rgba(225, 29, 72, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --card-radius: 20px;
            --item-radius: 14px;
            --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            outline: none !important;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 0% 0%, rgba(225, 29, 72, 0.18) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 940px;
        }

        /* Scrollbar Stylings */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(225, 29, 72, 0.6);
        }

        /* Header Visuals */
        .app-header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(225, 29, 72, 0.12);
            border: 1px solid rgba(225, 29, 72, 0.28);
            border-radius: 9999px;
            color: #fb7185;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            backdrop-filter: blur(8px);
        }

        .main-title {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
        }

        .sub-title {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
        }

        /* Glassmorphism Cards */
        .glass-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-glass);
            border-radius: var(--card-radius);
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 2rem;
            margin-bottom: 2rem;
            transition: var(--transition-smooth);
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.14);
        }

        /* Mode Selector Pills */
        .mode-selector-wrapper {
            background: rgba(11, 15, 25, 0.7);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid var(--border-glass);
            display: flex;
            gap: 6px;
            margin-bottom: 1.8rem;
            overflow-x: auto;
        }

        .mode-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-radius: 11px;
            white-space: nowrap;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .mode-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.04);
        }

        .mode-btn.active {
            color: #ffffff;
            background: var(--primary-gradient);
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        /* Form UI elements */
        .form-label {
            font-size: 0.86rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .form-control, .form-select {
            background-color: rgba(15, 23, 42, 0.65) !important;
            border: 1px solid var(--border-glass) !important;
            border-radius: 12px !important;
            color: #ffffff !important;
            padding: 12px 16px !important;
            font-size: 0.95rem !important;
            transition: var(--transition-smooth) !important;
        }

        .form-control:focus, .form-select:focus {
            border-color: #e11d48 !important;
            box-shadow: 0 0 0 4px rgba(225, 29, 72, 0.2) !important;
            background-color: rgba(15, 23, 42, 0.9) !important;
        }

        .form-select option {
            background-color: #0f172a;
            color: #ffffff;
        }

        .action-button {
            background: var(--primary-gradient);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.98rem;
            font-weight: 700;
            padding: 13px 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 18px var(--accent-glow);
            transition: var(--transition-smooth);
            cursor: pointer;
        }

        .action-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(225, 29, 72, 0.5);
            color: #ffffff;
        }

        .action-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Track Item Cards */
        .list-group {
            border-radius: var(--item-radius);
            gap: 8px;
        }

        .list-group-item {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-glass) !important;
            border-radius: var(--item-radius) !important;
            color: var(--text-main) !important;
            padding: 12px 18px !important;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition-smooth);
            backdrop-filter: blur(10px);
        }

        .list-group-item:hover {
            border-color: rgba(255, 255, 255, 0.2) !important;
            background: rgba(30, 41, 67, 0.8) !important;
            transform: scale(1.006);
        }

        .song-title, .playlist-title {
            display: inline-block;
            max-width: 260px;
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
            color: #f1f5f9;
        }

        .track-meta {
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .track-img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            flex-shrink: 0;
            margin-right: 14px;
        }

        .btn-sub-action {
            border-radius: 9px;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 7px 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-glass);
            transition: var(--transition-smooth);
        }

        .btn-outline-custom {
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.08);
            border-color: rgba(56, 189, 248, 0.25);
        }
        .btn-outline-custom:hover {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }

        .btn-download-custom {
            color: #34d399;
            background: rgba(52, 211, 153, 0.08);
            border-color: rgba(52, 211, 153, 0.25);
        }
        .btn-download-custom:hover {
            background: #10b981;
            color: #042f2e;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        /* Song Detailed Stage */
        .song-banner-card {
            background: linear-gradient(145deg, rgba(20, 27, 45, 0.85) 0%, rgba(13, 18, 30, 0.95) 100%);
            border: 1px solid var(--border-glass);
            border-radius: var(--card-radius);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .badge-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .badge-chip-primary { background: rgba(225, 29, 72, 0.15); color: #fb7185; border: 1px solid rgba(225, 29, 72, 0.3); }
        .badge-chip-secondary { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.25); }
        .badge-chip-success { background: rgba(52, 211, 153, 0.15); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.3); }
        .badge-chip-warning { background: rgba(251, 191, 36, 0.15); color: #fde047; border: 1px solid rgba(251, 191, 36, 0.3); }
        .badge-chip-info { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); }

        /* Lyric Box styling */
        .lyric-box {
            max-height: 220px;
            overflow-y: auto;
            background: rgba(10, 14, 23, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 0.92rem;
            color: #94a3b8;
            line-height: 1.8;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
        }

        /* Customized APlayer Skin */
        .aplayer {
            background: rgba(15, 23, 42, 0.8) !important;
            border: 1px solid var(--border-glass) !important;
            border-radius: 14px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3) !important;
            margin: 0 !important;
            font-family: inherit !important;
        }
        .aplayer .aplayer-info {
            border-top: none !important;
            padding: 14px 16px !important;
        }
        .aplayer .aplayer-title {
            color: #ffffff !important;
            font-weight: 600 !important;
            font-size: 1rem !important;
        }
        .aplayer .aplayer-author {
            color: #94a3b8 !important;
        }
        .aplayer .aplayer-lrc:before, .aplayer .aplayer-lrc:after {
            display: none !important;
        }
        .aplayer .aplayer-lrc p {
            color: #64748b !important;
            font-size: 0.85rem !important;
        }
        .aplayer .aplayer-lrc p.aplayer-lrc-current {
            color: #fb7185 !important;
            font-weight: 700 !important;
        }
        .aplayer .aplayer-bar-wrap .aplayer-bar .aplayer-played {
            background: #e11d48 !important;
        }
        .aplayer .aplayer-bar-wrap .aplayer-bar .aplayer-played .aplayer-thumb {
            background: #fb7185 !important;
            box-shadow: 0 0 10px #e11d48;
        }

        /* Progress Bar */
        .progress {
            background-color: rgba(15, 23, 42, 0.7);
            border-radius: 9999px;
            height: 10px;
            overflow: hidden;
            border: 1px solid var(--border-glass);
        }
        .progress-bar-animated-custom {
            background: linear-gradient(90deg, #e11d48, #3b82f6, #10b981);
            background-size: 200% 100%;
            animation: gradientMove 2s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* Modal styling */
        .modal-content {
            background: rgba(18, 24, 38, 0.95);
            border: 1px solid var(--border-glass);
            border-radius: var(--card-radius);
            backdrop-filter: blur(25px);
            color: #ffffff;
        }
        .modal-header {
            border-bottom: 1px solid var(--border-glass);
        }
        .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }

        /* Toast notification */
        .toast-notify {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 99999;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border-glass);
            border-left: 4px solid #10b981;
            padding: 14px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .toast-notify.show {
            transform: translateY(0);
            opacity: 1;
        }

        footer {
            margin-top: auto;
            padding: 24px 0;
            border-top: 1px solid var(--border-glass);
            color: var(--text-dim);
            font-size: 0.85rem;
        }
        footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition-smooth);
        }
        footer a:hover {
            color: #fb7185;
        }

        @media (max-width: 768px) {
            .main-title { font-size: 2rem; }
            .mode-selector-wrapper { flex-wrap: nowrap; overflow-x: scroll; }
            .song-title, .playlist-title { max-width: 140px; }
            .glass-panel { padding: 1.25rem; }
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <!-- Header -->
        <header class="app-header">
            <div class="brand-badge"><i class="fa-solid fa-bolt"></i> NETEASE MUSIC PRO</div>
            <h1 class="main-title">网易云音乐工具箱</h1>
            <p class="sub-title">无损母带解析 · 歌单/专辑提取 · 智能元数据嵌入</p>
        </header>

        <!-- Main Panel -->
        <div class="glass-panel">
            <!-- Mode Switcher Nav -->
            <div class="mode-selector-wrapper">
                <button type="button" class="mode-btn active" data-mode="search"><i class="fa-solid fa-magnifying-glass"></i> 歌曲搜索</button>
                <button type="button" class="mode-btn" data-mode="parse"><i class="fa-solid fa-cube"></i> 单曲解析</button>
                <button type="button" class="mode-btn" data-mode="playlist"><i class="fa-solid fa-list-ul"></i> 歌单解析</button>
                <button type="button" class="mode-btn" data-mode="album"><i class="fa-solid fa-compact-disc"></i> 专辑解析</button>
                <button type="button" class="mode-btn" data-mode="download"><i class="fa-solid fa-circle-down"></i> 音乐下载</button>
            </div>

            <!-- Main Form (Original IDs preserved) -->
            <form id="main-form">
                <!-- Keep hidden select for JS sync with existing script expectations -->
                <select id="mode-select" class="d-none">
                    <option value="search">歌曲搜索</option>
                    <option value="parse">单曲解析</option>
                    <option value="playlist">歌单解析</option>
                    <option value="album">专辑解析</option>
                    <option value="download">音乐下载</option>
                </select>

                <!-- Search Area -->
                <div id="search-area">
                    <div class="row g-3">
                        <div class="col-md-9">
                            <label for="search_keywords" class="form-label"><i class="fa-solid fa-terminal"></i> 搜索关键词</label>
                            <input type="text" id="search_keywords" class="form-control" placeholder="输入歌名、歌手或相关关键词...">
                        </div>
                        <div class="col-md-3">
                            <label for="search_limit" class="form-label"><i class="fa-solid fa-sliders"></i> 返回条数</label>
                            <input type="number" id="search_limit" class="form-control" value="10" min="1" max="50">
                        </div>
                    </div>
                    <div class="text-center mt-4">
                        <button type="button" id="search-btn" class="action-button w-100"><i class="fa-solid fa-magnifying-glass"></i> 立即搜索</button>
                    </div>
                </div>

                <!-- Parse Area -->
                <div id="parse-area" style="display:none;">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label for="song_ids" class="form-label"><i class="fa-solid fa-link"></i> 歌曲 ID 或 URL</label>
                            <input type="text" id="song_ids" class="form-control" placeholder="例如: 186016 或 https://music.163.com/#/song?id=186016">
                        </div>
                        <div class="col-md-4">
                            <label for="level" class="form-label"><i class="fa-solid fa-headphones"></i> 音质等级</label>
                            <select id="level" class="form-select">
                                <option value="standard">标准音质 (128kbps)</option>
                                <option value="exhigh">极高音质 (320kbps)</option>
                                <option value="lossless">无损音质 (FLAC)</option>
                                <option value="hires">Hi-Res 高清母带</option>
                                <option value="sky">沉浸环绕声</option>
                                <option value="jyeffect">高清环绕声</option>
                                <option value="jymaster">超清母带</option>
                                <option value="dolby">杜比全景声</option>
                            </select>
                        </div>
                    </div>
                    <div class="text-center mt-4">
                        <button type="button" id="parse-btn" class="action-button w-100"><i class="fa-solid fa-bolt"></i> 解析单曲信息</button>
                    </div>
                </div>

                <!-- Playlist Area -->
                <div id="playlist-area" style="display:none;">
                    <div class="mb-3">
                        <label for="playlist_id" class="form-label"><i class="fa-solid fa-rectangle-list"></i> 歌单 ID 或链接</label>
                        <input type="text" id="playlist_id" class="form-control" placeholder="输入歌单 ID 或网易云歌单分享链接...">
                    </div>
                    <div class="text-center mt-4">
                        <button type="button" id="playlist-btn" class="action-button w-100" style="background: linear-gradient(135deg, #d97706 0%, #b45309 100%);"><i class="fa-solid fa-list-check"></i> 解析歌单全部曲目</button>
                    </div>
                </div>

                <!-- Album Area -->
                <div id="album-area" style="display:none;">
                    <div class="mb-3">
                        <label for="album_id" class="form-label"><i class="fa-solid fa-record-vinyl"></i> 专辑 ID 或链接</label>
                        <input type="text" id="album_id" class="form-control" placeholder="输入专辑 ID 或网易云专辑分享链接...">
                    </div>
                    <div class="text-center mt-4">
                        <button type="button" id="album-btn" class="action-button w-100" style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);"><i class="fa-solid fa-compact-disc"></i> 解析专辑全部内容</button>
                    </div>
                </div>

                <!-- Download Area -->
                <div id="download-area" style="display:none;">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label for="download_id" class="form-label"><i class="fa-solid fa-music"></i> 音乐 ID 或 URL</label>
                            <input type="text" id="download_id" class="form-control" placeholder="输入歌曲 ID 或复制分享链接...">
                        </div>
                        <div class="col-md-4">
                            <label for="download_quality" class="form-label"><i class="fa-solid fa-wave-square"></i> 音质等级</label>
                            <select id="download_quality" class="form-select">
                                <option value="standard">标准音质</option>
                                <option value="exhigh">极高音质</option>
                                <option value="lossless" selected>无损音质 (FLAC)</option>
                                <option value="hires">Hi-Res 音质</option>
                                <option value="sky">沉浸环绕声</option>
                                <option value="jyeffect">高清环绕声</option>
                                <option value="jymaster">超清母带</option>
                                <option value="dolby">杜比全景声</option>
                            </select>
                        </div>
                    </div>
                    <div class="text-center mt-4">
                        <button type="button" id="download-btn" class="action-button w-100" style="background: linear-gradient(135deg, #059669 0%, #047857 100%);"><i class="fa-solid fa-cloud-arrow-down"></i> 下载并封装元数据</button>
                    </div>
                    <div id="download-progress" class="mt-4 d-none">
                        <div class="progress">
                            <div class="progress-bar progress-bar-animated-custom" role="progressbar" style="width: 100%"></div>
                        </div>
                        <div class="text-center mt-2">
                            <small class="text-muted"><i class="fa-solid fa-spinner fa-spin me-1"></i> 正在向网易云服务器请求数据并写入 ID3/FLAC 元信息...</small>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- Search Results View -->
        <div id="search-result" class="glass-panel d-none">
            <h5 class="mb-3 d-flex align-items-center gap-2"><i class="fa-solid fa-square-poll-vertical text-danger"></i> 搜索结果</h5>
            <ul class="list-group" id="search-list"></ul>
        </div>

        <!-- Single Song Result Detail View -->
        <div id="song-info" class="song-banner-card glass-panel d-none p-0">
            <div class="p-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-3">
                    <div>
                        <h3 class="mb-2" id="song_name" style="font-weight: 800; color: #fff;"></h3>
                        <div class="d-flex flex-wrap gap-2">
                            <span class="badge-chip badge-chip-primary"><i class="fa-solid fa-user"></i> <span id="artist_names"></span></span>
                            <span class="badge-chip badge-chip-secondary"><i class="fa-solid fa-compact-disc"></i> <span id="song_alname"></span></span>
                            <span class="badge-chip badge-chip-success"><i class="fa-solid fa-shield-halved"></i> <span id="song_level"></span></span>
                            <span class="badge-chip badge-chip-warning"><i class="fa-solid fa-database"></i> <span id="song_size"></span></span>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="show-big-pic" type="button" class="btn btn-outline-light btn-sm btn-sub-action"><i class="fa-solid fa-image"></i> 查看封面</button>
                        <a id="song_url" href="" target="_blank" class="btn btn-danger btn-sm btn-sub-action"><i class="fa-solid fa-arrow-up-right-from-square"></i> 直链直通</a>
                    </div>
                </div>

                <div class="mb-2 text-muted small"><i class="fa-solid fa-align-left me-1"></i> 歌词同步解析</div>
                <div class="lyric-box mb-4" id="lyric"></div>

        <!-- Playlist Result View -->

                <img id="playlist-cover" src="" alt="cover" class="track-img" style="width: 70px; height: 70px;">

        <div id="album-result" class="glass-panel d-none">

                    <h5 id="album-name" class="mb-1 text-white fw-bold"></h5>
                    <div class="text-muted small" id="album-artist"></div>

                </div>
            </div>
            <div id="album-desc" class="mb-3 text-muted small" style="white-space: pre-line;"></div>

    <!-- Modal for big picture -->
    <div class="modal fade" id="bigPicModal" tabindex="-1" aria-labelledby="bigPicModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title" id="bigPicModalLabel"><i class="fa-solid fa-image me-2 text-danger"></i> 高清原图预览</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center p-3">
                    <img id="big-pic-img" src="" alt="大图" style="max-width:100%; max-height:65vh; border-radius:12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);">

    <!-- Toast Component -->
    <div id="app-toast" class="toast-notify">
        <i class="fa-solid fa-circle-check text-success fs-5"></i>
        <span id="toast-text" class="text-white small fw-bold">操作成功</span>
    </div>

    <!-- Footer -->
    <footer class="footer text-center">
        <div class="container">
            <span>网易云音乐工具箱 &copy; 2026 | NextGen Web Audio Engine | Powered by JackZ</span>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/aplayer/1.10.1/APlayer.min.js"></script>
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function() {
            // Memory storage for mapping song names cleanly to download files
            window.songNameCache = {};

            function showToast(msg) {
                const toast = $('#app-toast');
                $('#toast-text').text(msg);
                toast.addClass('show');
                setTimeout(() => {
                    toast.removeClass('show');
                }, 3200);
            }

            function lrctrim(lyrics) {
                const lines = lyrics.split('\n');
                const data = [];

                lines.forEach((line, index) => {
                    const matches = line.match(/\[(\d{2}):(\d{2}[\.:]?\d*)]/);
                    if (matches) {
                        const minutes = parseInt(matches[1], 10);
                        const seconds = parseFloat(matches[2].replace('.', ':')) || 0;
                        const timestamp = minutes * 60000 + seconds * 1000;

                        let text = line.replace(/\[\d{2}:\d{2}[\.:]?\d*\]/g, '').trim();
                        text = text.replace(/\s\s+/g, ' ');

                        data.push([timestamp, index, text]);
                    }
                });

                data.sort((a, b) => a[0] - b[0]);
                return data;
            }

            function lrctran(lyric, tlyric) {
                lyric = lrctrim(lyric);
                tlyric = lrctrim(tlyric);

                let len1 = lyric.length;
                let len2 = tlyric.length;
                let result = "";

                for (let i = 0, j = 0; i < len1 && j < len2; i++) {
                    while (lyric[i][0] > tlyric[j][0] && j + 1 < len2) {
                        j++;
                    }

                    if (lyric[i][0] === tlyric[j][0]) {
                        tlyric[j][2] = tlyric[j][2].replace('/', '');
                        if (tlyric[j][2]) {
                            lyric[i][2] += ` (翻译：${tlyric[j][2]})`;
                        }
                        j++;
                    }
                }

                for (let i = 0; i < len1; i++) {
                    let t = lyric[i][0];
                    result += `[${String(Math.floor(t / 60000)).padStart(2, '0')}:${String(Math.floor((t % 60000) / 1000)).padStart(2, '0')}.${String(t % 1000).padStart(3, '0')}]${lyric[i][2]}\n`;
                }

                return result;
            }

            function extractLinks(text) {
                var regex = /https?:\/\/\S+/g;
                var matches = text.match(regex);
                return matches ? matches[0] : '';
            }
    
            function checkValidLink(link) {
                if (link.indexOf("http") === -1 || 
                    (link.indexOf("music.163.com") === -1 && link.indexOf("163cn.tv") === -1)) {
                    return false;
                }
                return true;
            }
    
            function extractAndCheckId(text) {
                var link = extractLinks(text);
                if (checkValidLink(link)) {
                    return link;
                } else {
                    var idRegex = /\b\d+\b/g;
                    var ids = text.match(idRegex);
                    if (ids && ids.length > 0) {
                        return ids[0];
                    }
                    return '';
                }
            }

            // Custom Tab Pill Switcher synced with #mode-select
            $('.mode-btn').on('click', function() {
                $('.mode-btn').removeClass('active');
                $(this).addClass('active');
                const targetMode = $(this).data('mode');
                $('#mode-select').val(targetMode).trigger('change');
            });

            // 切换功能区 (Exact logic preserved)
            $('#mode-select').on('change', function() {
                const currentMode = $(this).val();
                $(`.mode-btn[data-mode="${currentMode}"]`).addClass('active').siblings().removeClass('active');

                if (currentMode === 'search') {
                    $('#search-area').fadeIn(200);
                    $('#parse-area, #playlist-area, #album-area, #download-area').hide();
                    $('#song-info, #playlist-result, #album-result').addClass('d-none');
                } else if (currentMode === 'parse') {
                    $('#parse-area').fadeIn(200);
                    $('#search-area, #playlist-area, #album-area, #download-area').hide();
                    $('#search-result, #playlist-result, #album-result').addClass('d-none');
                } else if (currentMode === 'playlist') {
                    $('#playlist-area').fadeIn(200);
                    $('#search-area, #parse-area, #album-area, #download-area').hide();
                    $('#search-result, #song-info, #album-result').addClass('d-none');
                } else if (currentMode === 'album') {
                    $('#album-area').fadeIn(200);
                    $('#search-area, #parse-area, #playlist-area, #download-area').hide();
                    $('#search-result, #song-info, #playlist-result').addClass('d-none');
                } else if (currentMode === 'download') {
                    $('#download-area').fadeIn(200);
                    $('#search-area, #parse-area, #playlist-area, #album-area').hide();
                    $('#search-result, #song-info, #playlist-result, #album-result').addClass('d-none');
                }
            });

            // 搜索功能
            $('#search-btn').on('click', function() {
                const keywords = $('#search_keywords').val().trim();
                const limit = $('#search_limit').val();
                if (!keywords) {
                    alert('请输入搜索关键词');
                    return;
                }
                const $btn = $(this);
                $btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 正在搜索...');

                $.ajax({
                    url: '/Search',
                    method: 'POST',
                    data: { keyword: keywords, limit: limit },
                    dataType: 'json',
                    success: function(data) {
                        $btn.prop('disabled', false).html('<i class="fa-solid fa-magnifying-glass"></i> 立即搜索');
                        if (data.status === 200) {
                            $('#search-list').empty();
                            data.data.forEach(function(song) {
                                // Cache song name
                                window.songNameCache[song.id] = song.name;

                                const item = `<li class="list-group-item">
                                    <div class="d-flex align-items-center">
                                        <img src="${song.picUrl}" alt="cover" class="track-img">
                                        <div>
                                            <div><strong class='song-title'>${song.name}</strong></div>
                                            <div class="track-meta"><span>${song.artists}</span> <span class="text-dim">· ${song.album}</span></div>
                                        </div>
                                    </div>
                                    <div class="d-flex align-items-center gap-2">
                                        <button class="btn btn-sm btn-sub-action btn-outline-custom select-song" data-id="${song.id}" data-name="${song.name}"><i class="fa-solid fa-cube"></i> 解析</button>
                                        <button class="btn btn-sm btn-sub-action btn-download-custom download-song" data-id="${song.id}" data-name="${song.name}"><i class="fa-solid fa-download"></i> 下载</button>
                                    </div>
                                </li>`;
                                $('#search-list').append(item);
                            });
                            $('#search-result').removeClass('d-none');
                        } else {
                            $('#search-list').html('<li class="list-group-item text-center text-muted">未找到相关歌曲</li>');
                            $('#search-result').removeClass('d-none');
                        }
                    },
                    error: function() {
                        $btn.prop('disabled', false).html('<i class="fa-solid fa-magnifying-glass"></i> 立即搜索');
                        $('#search-list').html('<li class="list-group-item text-center text-danger">搜索失败，请重试</li>');
                        $('#search-result').removeClass('d-none');
                    }
                });
            });

            // 搜索结果点击解析
            $(document).on('click', '.select-song', function() {
                const songId = $(this).data('id');
                $('#song_ids').val(songId);
                $('#mode-select').val('parse').trigger('change');
                $('html,body').animate({scrollTop: $('#main-form').offset().top - 20}, 300);
            });

            // 单曲解析
            $('#parse-btn').on('click', function() {
                const songIds = $('#song_ids').val().trim();
                const level = $('#level').val();
                if (!songIds) {
                    alert('请输入歌曲ID或URL');
                    return;
                }
                const $btn = $(this);
                $btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 正在解析中...');

                $.post('/Song_V1', { url: songIds, level: level, type:'json' }, function(data) {
                    $btn.prop('disabled', false).html('<i class="fa-solid fa-bolt"></i> 解析单曲信息');
                    if (data.status === 200) {
                        $('#song_name').text(data.data.name);
                        $('#artist_names').text(data.data.ar_name);
                        $('#song_alname').text(data.data.al_name);
                        $('#song_level').text(data.data.level);
                        $('#song_size').text(data.data.size);

                        // Cache clean song name for downloader
                        if (data.data.id) {
                            window.songNameCache[data.data.id] = data.data.name;
                        }

                        let processedLyrics = data.data.lyric;
                        if (data.data.tlyric) {
                            processedLyrics = lrctran(data.data.lyric, data.data.tlyric);
                        }
                        $('#lyric').html(processedLyrics.replace(/\n/g, '<br>'));
                        $('#song_url').attr('href', data.data.url).html('<i class="fa-solid fa-arrow-up-right-from-square"></i> 点击下载');
                        $('#song-info').removeClass('d-none');
                        $('#show-big-pic').data('pic', data.data.pic);

                        new APlayer({
                            container: document.getElementById('aplayer'),
                            lrcType: 1,
                            audio: [{
                                name: data.data.name,
                                artist: data.data.ar_name,
                                url: data.data.url,
                                cover: data.data.pic,
                                lrc: processedLyrics
                            }]
                        });
                        showToast(`已解析: ${data.data.name}`);
                    } else {
                        alert(data.data.msg);
                    }
                }, 'json').fail(function() {
                    $btn.prop('disabled', false).html('<i class="fa-solid fa-bolt"></i> 解析单曲信息');
                    alert('请求失败，请检查网络或后端接口');
                });
            });

            // 显示大图按钮事件
            $(document).on('click', '#show-big-pic', function() {
                var picUrl = $(this).data('pic');
                $('#big-pic-img').attr('src', picUrl);
                var modal = new bootstrap.Modal(document.getElementById('bigPicModal'));
                modal.show();
            });

            // 歌单解析
            $('#playlist-btn').on('click', function() {
                let pid = $('#playlist_id').val().trim();
                if (!pid) {
                    alert('请输入歌单ID或链接');
                    return;
                }
                const idMatch = pid.match(/playlist\?id=(\d+)/);
                if (idMatch) pid = idMatch[1];

                const $btn = $(this);
                $btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 解析歌单中...');

                $.get('/Playlist', { id: pid }, function(data) {
                    $btn.prop('disabled', false).html('<i class="fa-solid fa-list-check"></i> 解析歌单全部曲目');
                    if (data.status === 200) {
                        const pl = data.data.playlist;
                        $('#playlist-cover').attr('src', pl.coverImgUrl);
                        $('#playlist-name').text(pl.name);
                        $('#playlist-creator').text('By ' + pl.creator);
                        $('#playlist-desc').text(pl.description || '');
                        $('#playlist-count').text(pl.trackCount);
                        $('#playlist-tracks').empty();

                        pl.tracks.forEach(function(song, idx) {
                            window.songNameCache[song.id] = song.name;

                            const item = `<li class="list-group-item">
                                <div class="d-flex align-items-center">
                                    <img src="${song.picUrl}" alt="cover" class="track-img" style="width: 40px; height: 40px;">
                                    <div>
                                        <div><strong class="playlist-title">${idx+1}. ${song.name}</strong></div>
                                        <div class="track-meta"><span>${song.artists}</span> <span class="text-dim">· ${song.album}</span></div>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <button class="btn btn-sm btn-sub-action btn-outline-custom select-song" data-id="${song.id}" data-name="${song.name}"><i class="fa-solid fa-cube"></i> 解析</button>
                                    <button class="btn btn-sm btn-sub-action btn-download-custom download-song" data-id="${song.id}" data-name="${song.name}"><i class="fa-solid fa-download"></i> 下载</button>
                                </div>
                            </li>`;
                            $('#playlist-tracks').append(item);
                        });
                        $('#playlist-result').removeClass('d-none');
                        showToast(`歌单解析成功: 共 ${pl.trackCount} 首`);
                    } else {
                        $('#playlist-result').removeClass('d-none');
                        $('#playlist-tracks').html('<li class="list-group-item text-danger">歌单解析失败：'+data.data.msg+'</li>');
                    }
                }, 'json').fail(function() {
                    $btn.prop('disabled', false).html('<i class="fa-solid fa-list-check"></i> 解析歌单全部曲目');
                    alert('网络连接错误，解析歌单失败');
                });
            });

            // 专辑解析
            $(document).on('click', '#album-btn', function() {
                let aid = $('#album_id').val().trim();
                if (!aid) {
                    alert('请输入专辑ID或链接');
                    return;
                }
                const idMatch = aid.match(/album\?id=(\d+)/);
                if (idMatch) aid = idMatch[1];

                const $btn = $(this);
                $btn.prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 解析专辑中...');

                $.get('/Album', { id: aid }, function(data) {
                    $btn.prop('disabled', false).html('<i class="fa-solid fa-compact-disc"></i> 解析专辑全部内容');
                    if (data.status === 200) {
                        const al = data.data.album;
                        $('#album-cover').attr('src', al.coverImgUrl);
                        $('#album-name').text(al.name);
                        $('#album-artist').text('Artist: ' + al.artist);
                        $('#album-desc').text(al.description || '');
                        $('#album-count').text(al.songs.length);
                        $('#album-tracks').empty();

                        al.songs.forEach(function(song, idx) {
                            window.songNameCache[song.id] = song.name;

                            const item = `<li class="list-group-item">
                                <div class="d-flex align-items-center">
                                    <img src="${song.picUrl}" alt="cover" class="track-img" style="width: 40px; height: 40px;">
                                    <div>
                                        <div><strong class="playlist-title">${idx+1}. ${song.name}</strong></div>
                                        <div class="track-meta"><span>${song.artists}</span> <span class="text-dim">· ${song.album}</span></div>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <button class="btn btn-sm btn-sub-action btn-outline-custom select-song" data-id="${song.id}" data-name="${song.name}"><i class="fa-solid fa-cube"></i> 解析</button>
                                    <button class="btn btn-sm btn-sub-action btn-download-custom download-song" data-id="${song.id}" data-name="${song.name}"><i class="fa-solid fa-download"></i> 下载</button>
                                </div>
                            </li>`;
                            $('#album-tracks').append(item);
                        });
                        $('#album-result').removeClass('d-none');
                        showToast(`专辑解析成功: 共 ${al.songs.length} 首`);
                    } else {
                        $('#album-result').removeClass('d-none');
                        $('#album-tracks').html('<li class="list-group-item text-danger">专辑解析失败：'+data.data.msg+'</li>');
                    }
                }, 'json').fail(function() {
                    $btn.prop('disabled', false).html('<i class="fa-solid fa-compact-disc"></i> 解析专辑全部内容');
                    alert('网络连接错误，解析专辑失败');
                });
            });

            // 音乐下载功能（已修改为强制重命名为 <SongName>.mp3 / <SongName>.flac）
            $('#download-btn').on('click', function() {
                const musicId = $('#download_id').val().trim();
                const quality = $('#download_quality').val();
                
                if (!musicId) {
                    alert('请输入音乐ID或URL');
                    return;
                }
                
                // 提取ID（支持URL格式）
                let processedId = musicId;
                const idMatch = musicId.match(/song\?id=(\d+)/);
                if (idMatch) {
                    processedId = idMatch[1];
                }
                
                // 显示进度条
                $('#download-progress').removeClass('d-none');
                $('#download-btn').prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin"></i> 下载并写入元数据中...');
                
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/Download', true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                xhr.responseType = 'blob';
                
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        const downloadMessage = xhr.getResponseHeader('X-Download-Message');
                        const encodedFilename = xhr.getResponseHeader('X-Download-Filename');
                        let serverFilename = encodedFilename ? decodeURIComponent(encodedFilename) : '';

                        // 确定文件扩展名
                        let ext = 'flac';
                        if (['standard', 'exhigh'].includes(quality)) {
                            ext = 'mp3';
                        }
                        if (serverFilename && serverFilename.lastIndexOf('.') !== -1) {
                            ext = serverFilename.substring(serverFilename.lastIndexOf('.') + 1).toLowerCase();
                        }

                        // 优先从缓存或UI获取纯粹的 SongName，达到 "<SongName>.mp3/.flac" 规则
                        let targetSongName = window.songNameCache[processedId] || window.currentActiveSongName || '';

                        // 如果缓存没有，再从服务端返回的文件名中解析清洗纯歌名
                        if (!targetSongName && serverFilename) {
                            let raw = serverFilename.substring(0, serverFilename.lastIndexOf('.')) || serverFilename;
                            if (raw.includes(' - ')) {
                                // 多数网易云格式是 "歌手 - 歌名"，取出歌名部分
                                targetSongName = raw.split(' - ').slice(1).join(' - ').trim();
                            } else {
                                targetSongName = raw;
                            }
                        }

                        // 保底命名
                        if (!targetSongName) {
                            targetSongName = `Music_${processedId}`;
                        }

                        // 清洗非法文件名字符 (\ / : * ? " < > |)
                        targetSongName = targetSongName.replace(/[\\/:*?"<>|]/g, '_').trim();

                        // 最终纯净格式: <SongName>.ext
                        const finalFilename = `${targetSongName}.${ext}`;
                        
                        // 创建下载触发
                        const blob = xhr.response;
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = finalFilename;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                        
                        showToast(`已下载: ${finalFilename}`);
                        console.log(`[NextGen Studio] 文件下载成功: ${finalFilename}`);
                        if (downloadMessage) {
                            console.log(`[NextGen Studio] 服务端状态: ${downloadMessage}`);
                        }
                    } else {
                        alert('下载失败，请重试');
                    }
                    
                    // 重置按钮状态
                    $('#download-progress').addClass('d-none');
                    $('#download-btn').prop('disabled', false).html('<i class="fa-solid fa-cloud-arrow-down"></i> 下载并封装元数据');
                };
                
                xhr.onerror = function() {
                    alert('下载出错，请重试');
                    $('#download-progress').addClass('d-none');
                    $('#download-btn').prop('disabled', false).html('<i class="fa-solid fa-cloud-arrow-down"></i> 下载并封装元数据');
                };
                
                // 发送请求 (参数规则完全原样发送)
                const formData = `id=${encodeURIComponent(processedId)}&quality=${encodeURIComponent(quality)}`;
                xhr.send(formData);
            });

            // 列表下载按钮跳转
            $(document).on('click', '.download-song', function() {
                const musicId = $(this).data('id');
                const songName = $(this).data('name');
                
                if (!musicId) {
                    alert('无法获取音乐ID');
                    return;
                }
                
                // 缓存当前歌名供下载命名
                if (songName) {
                    window.currentActiveSongName = songName;
                    window.songNameCache[musicId] = songName;
                }

                $('#download_id').val(musicId);
                $('#mode-select').val('download').trigger('change');
                $('html,body').animate({scrollTop: $('#main-form').offset().top - 20}, 300);
            });
        });
    </script>
</body>
</html>
