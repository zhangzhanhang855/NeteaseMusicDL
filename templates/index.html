<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐工具箱</title>
    <!-- Core External CSS -->
    <link href="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/aplayer/1.10.1/APlayer.min.css">
    <!-- Font Awesome Icons & Inter Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131b2e;
            --bg-card: rgba(23, 32, 54, 0.72);
            --bg-glass: rgba(30, 41, 69, 0.45);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(235, 68, 90, 0.6);
            --primary: #ec4141;
            --primary-glow: rgba(236, 65, 65, 0.35);
            --primary-hover: #d43838;
            --accent-cyan: #06b6d4;
            --accent-purple: #8b5cf6;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 8px;
            --transition-smooth: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            outline: none;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(236, 65, 65, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(19, 27, 46, 0.8) 0%, var(--bg-primary) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            letter-spacing: -0.01em;
        }

        /* Ambient Glow Backdrop */
        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 400px;
            background: linear-gradient(180deg, rgba(236, 65, 65, 0.08) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        /* Hero Header */
        .header-section {
            padding: 40px 0 30px;
            text-align: center;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(236, 65, 65, 0.12);
            border: 1px solid rgba(236, 65, 65, 0.25);
            border-radius: 9999px;
            color: #ff6b6b;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 16px;
            backdrop-filter: blur(8px);
        }

        h1.main-title {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 70%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
        }

        /* Glassmorphism Surface Panel */
        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: var(--transition-smooth);
            overflow: hidden;
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.14);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 30px rgba(236, 65, 65, 0.08);
        }

        .card-body {
            padding: 36px !important;
        }

        /* Form Labels & Fields */
        .form-label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-label i {
            color: var(--primary);
            font-size: 0.95rem;
        }

        .form-control, .form-select {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            color: #f1f5f9;
            padding: 12px 18px;
            font-size: 0.95rem;
            transition: var(--transition-smooth);
        }

        .form-control:focus, .form-select:focus {
            background: rgba(15, 23, 42, 0.9);
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(236, 65, 65, 0.15);
            color: #fff;
        }

        .form-control::placeholder {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        .form-select option {
            background-color: var(--bg-secondary);
            color: #fff;
            padding: 8px;
        }

        /* Interactive Mode Selection Ribbon */
        .mode-nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 28px;
            background: rgba(11, 15, 25, 0.6);
            padding: 6px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
        }

        .mode-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 12px;
            font-size: 0.88rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mode-nav-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .mode-nav-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, #d43838 100%);
            color: #fff;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* Modernized Interactive Action Buttons */
        .btn-modern {
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.01em;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .btn-modern::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 255, 255, 0.15), transparent);
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .btn-modern:hover::after {
            opacity: 1;
        }

        /* Redefined Original Buttons with Deep Glows */
        .btn-primary, #parse-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%) !important;
            border: none !important;
            color: #fff !important;
            box-shadow: 0 6px 20px -2px rgba(59, 130, 246, 0.35);
        }
        .btn-primary:hover, #parse-btn:hover {
            box-shadow: 0 8px 24px -2px rgba(59, 130, 246, 0.5);
            transform: translateY(-2px);
        }

        .btn-success, #search-btn, #download-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            border: none !important;
            color: #fff !important;
            box-shadow: 0 6px 20px -2px rgba(16, 185, 129, 0.35);
        }
        .btn-success:hover, #search-btn:hover, #download-btn:hover {
            box-shadow: 0 8px 24px -2px rgba(16, 185, 129, 0.5);
            transform: translateY(-2px);
        }

        .btn-warning, #playlist-btn {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important;
            border: none !important;
            color: #fff !important;
            box-shadow: 0 6px 20px -2px rgba(245, 158, 11, 0.35);
        }
        .btn-warning:hover, #playlist-btn:hover {
            box-shadow: 0 8px 24px -2px rgba(245, 158, 11, 0.5);
            transform: translateY(-2px);
        }

        .btn-info, #album-btn {
            background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%) !important;
            border: none !important;
            color: #fff !important;
            box-shadow: 0 6px 20px -2px rgba(6, 182, 212, 0.35);
        }
        .btn-info:hover, #album-btn:hover {
            box-shadow: 0 8px 24px -2px rgba(6, 182, 212, 0.5);
            transform: translateY(-2px);
        }

        /* Action Buttons Inside Song Rows */
        .select-song {
            border-radius: var(--radius-sm) !important;
            font-weight: 500 !important;
            padding: 6px 14px !important;
            background: rgba(59, 130, 246, 0.12) !important;
            border: 1px solid rgba(59, 130, 246, 0.25) !important;
            color: #60a5fa !important;
            transition: var(--transition-smooth) !important;
        }
        .select-song:hover {
            background: rgba(59, 130, 246, 0.3) !important;
            color: #fff !important;
            transform: translateY(-1px);
        }

        .download-song {
            border-radius: var(--radius-sm) !important;
            font-weight: 500 !important;
            padding: 6px 14px !important;
            background: rgba(16, 185, 129, 0.15) !important;
            border: 1px solid rgba(16, 185, 129, 0.25) !important;
            color: #34d399 !important;
            transition: var(--transition-smooth) !important;
        }
        .download-song:hover {
            background: rgba(16, 185, 129, 0.3) !important;
            color: #fff !important;
            transform: translateY(-1px);
        }

        /* Glass Song Items & Hover States */
        .list-group {
            background: transparent;
            border: none;
            gap: 8px;
        }

        .list-group-item {
            background: rgba(23, 32, 54, 0.6) !important;
            border: 1px solid var(--border-glass) !important;
            border-radius: var(--radius-md) !important;
            color: var(--text-main) !important;
            padding: 14px 18px !important;
            transition: var(--transition-smooth);
            backdrop-filter: blur(8px);
        }

        .list-group-item:hover {
            background: rgba(30, 41, 69, 0.85) !important;
            border-color: rgba(255, 255, 255, 0.12) !important;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
        }

        .song-title, .playlist-title {
            display: inline-block;
            max-width: 220px;
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
            color: #fff;
        }

        .list-group-item .select-song {
            flex-shrink: 0;
            margin-left: 10px;
        }

        /* Song Info Card (Overriding .alert-info) */
        #song-info.alert-info {
            background: var(--bg-card) !important;
            border: 1px solid var(--border-glass) !important;
            color: var(--text-main) !important;
            border-radius: var(--radius-lg) !important;
            overflow: hidden;
            backdrop-filter: blur(24px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5) !important;
        }

        #song_name {
            font-size: 1.6rem;
            font-weight: 800 !important;
            color: #fff;
            letter-spacing: -0.02em;
        }

        /* Badges Styling */
        .badge {
            padding: 6px 12px;
            font-weight: 600;
            font-size: 0.75rem;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge.bg-primary { background: rgba(59, 130, 246, 0.2) !important; color: #93c5fd !important; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge.bg-secondary { background: rgba(148, 163, 184, 0.2) !important; color: #cbd5e1 !important; border: 1px solid rgba(148, 163, 184, 0.3); }
        .badge.bg-success { background: rgba(16, 185, 129, 0.2) !important; color: #6ee7b7 !important; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.bg-warning { background: rgba(245, 158, 11, 0.2) !important; color: #fcd34d !important; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge.bg-info { background: rgba(6, 182, 212, 0.2) !important; color: #67e8f9 !important; border: 1px solid rgba(6, 182, 212, 0.3); }
        .badge.bg-dark { background: rgba(255, 255, 255, 0.1) !important; color: #e2e8f0 !important; border: 1px solid rgba(255, 255, 255, 0.15); }

        #song_url {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition-smooth);
        }

        #song_url:hover {
            color: #a5f3fc;
            text-decoration: underline;
        }

        /* Lyric Container */
        .lyric-box {
            max-height: 220px;
            overflow-y: auto;
            background: rgba(11, 15, 25, 0.7) !important;
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md) !important;
            padding: 16px 20px !important;
            font-size: 0.92rem !important;
            color: #cbd5e1 !important;
            line-height: 1.8 !important;
            font-family: 'JetBrains Mono', monospace, sans-serif;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4) !important;
        }

        .lyric-box::-webkit-scrollbar, ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .lyric-box::-webkit-scrollbar-thumb, ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
        }

        .lyric-box::-webkit-scrollbar-thumb:hover, ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* APlayer Custom Skin for Dark Mode */
        .aplayer {
            background: rgba(15, 23, 42, 0.8) !important;
            border-radius: var(--radius-md) !important;
            border: 1px solid var(--border-glass) !important;
            box-shadow: none !important;
            font-family: inherit !important;
        }
        .aplayer .aplayer-info {
            border-top: 1px solid var(--border-glass) !important;
        }
        .aplayer .aplayer-info .aplayer-music .aplayer-title {
            color: #fff !important;
        }
        .aplayer .aplayer-info .aplayer-music .aplayer-author {
            color: var(--text-muted) !important;
        }
        .aplayer .aplayer-lrc:before, .aplayer .aplayer-lrc:after {
            background: none !important;
        }
        .aplayer .aplayer-lrc p {
            color: var(--text-dim) !important;
        }
        .aplayer .aplayer-lrc p.aplayer-lrc-current {
            color: #ff6b6b !important;
        }

        /* Result Sections: Playlist & Album Header */
        #playlist-result .card, #album-result .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(20px);
            color: var(--text-main);
        }

        /* Modal Customization */
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            color: var(--text-main);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
        }

        .modal-header {
            border-bottom: 1px solid var(--border-glass);
        }

        .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }

        /* Progress Bar */
        .progress {
            background-color: rgba(15, 23, 42, 0.8);
            border-radius: 9999px;
            height: 12px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--primary) 0%, #ec4899 50%, #8b5cf6 100%) !important;
        }

        /* Footer */
        footer.footer {
            margin-top: auto !important;
            background: rgba(11, 15, 25, 0.7) !important;
            border-top: 1px solid var(--border-glass) !important;
            backdrop-filter: blur(16px);
        }

        footer.footer a {
            color: var(--text-muted);
            text-decoration: none;
            transition: var(--transition-smooth);
        }

        footer.footer a:hover {
            color: var(--primary);
        }

        /* Responsive Optimization */
        @media (max-width: 768px) {
            .mode-nav {
                grid-template-columns: repeat(3, 1fr);
            }
            .card-body {
                padding: 22px !important;
            }
            h1.main-title {
                font-size: 2rem;
            }
            .song-title, .playlist-title {
                max-width: 140px;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="container mt-4 mb-5">
        <!-- Main Top Bar -->
        <header class="header-section">
            <div class="brand-badge">
                <i class="fa-solid fa-compact-disc fa-spin"></i> Ultimate Audio Suite
            </div>
            <h1 class="main-title">网易云音乐工具箱</h1>
            <p class="header-subtitle">高速无损音频解析 · 歌单提取 · 专辑批量检索 · 元数据直链导出</p>
        </header>

        <!-- Main Form Glass Card -->
        <div class="card glass-panel shadow-sm">
            <div class="card-body">
                <!-- Visual Interactive Navigation Tabs -->
                <div class="mode-nav">
                    <button type="button" class="mode-nav-btn active" data-target="search"><i class="fa-solid fa-magnifying-glass"></i> 歌曲搜索</button>
                    <button type="button" class="mode-nav-btn" data-target="parse"><i class="fa-solid fa-link"></i> 单曲解析</button>
                    <button type="button" class="mode-nav-btn" data-target="playlist"><i class="fa-solid fa-list-ul"></i> 歌单解析</button>
                    <button type="button" class="mode-nav-btn" data-target="album"><i class="fa-solid fa-record-vinyl"></i> 专辑解析</button>
                    <button type="button" class="mode-nav-btn" data-target="download"><i class="fa-solid fa-cloud-arrow-down"></i> 音乐下载</button>
                </div>

                <form id="main-form">
                    <!-- Original Functional Select Component (Hidden from plain sight, triggered by interactive tabs) -->
                    <div class="mb-3 d-none">
                        <label class="form-label">功能选择</label>
                        <select id="mode-select" class="form-select">
                            <option value="search">歌曲搜索</option>
                            <option value="parse">单曲解析</option>
                            <option value="playlist">歌单解析</option>
                            <option value="album">专辑解析</option>
                            <option value="download">音乐下载</option>
                        </select>
                    </div>

                    <!-- Search Block -->
                    <div id="search-area">
                        <div class="mb-3">
                            <label for="search_keywords" class="form-label"><i class="fa-solid fa-signature"></i> 搜索关键词</label>
                            <input type="text" id="search_keywords" class="form-control" placeholder="输入歌曲名、歌手、或者专辑名...">
                        </div>
                        <div class="mb-4">
                            <label for="search_limit" class="form-label"><i class="fa-solid fa-sliders"></i> 返回数量</label>
                            <input type="number" id="search_limit" class="form-control" value="10" min="1" max="50">
                        </div>
                        <div class="text-center">
                            <button type="button" id="search-btn" class="btn btn-success btn-modern w-50">
                                <i class="fa-solid fa-magnifying-glass"></i> 立即搜索
                            </button>
                        </div>
                    </div>

                    <!-- Song Parse Block -->
                    <div id="parse-area" style="display:none;">
                        <div class="mb-3">
                            <label for="song_ids" class="form-label"><i class="fa-solid fa-barcode"></i> 歌曲ID或URL</label>
                            <input type="text" id="song_ids" class="form-control" placeholder="例如: 186016 或完整网页链接">
                        </div>
                        <div class="mb-4">
                            <label for="level" class="form-label"><i class="fa-solid fa-sliders"></i> 音质选择</label>
                            <select id="level" class="form-select">
                                <option value="standard">标准音质 (Standard)</option>
                                <option value="exhigh">极高音质 (HQ 320k)</option>
                                <option value="lossless">无损音质 (FLAC)</option>
                                <option value="hires">Hi-Res高解析音质</option>
                                <option value="sky">沉浸环绕声 (Sky Sound)</option>
                                <option value="jyeffect">高清环绕声</option>
                                <option value="jymaster">超清母带 (Master)</option>
                                <option value="dolby">杜比全景声 (Dolby Atmos)</option>
                            </select>
                        </div>
                        <div class="text-center">
                            <button type="button" id="parse-btn" class="btn btn-primary btn-modern w-50">
                                <i class="fa-solid fa-bolt"></i> 解析单曲
                            </button>
                        </div>
                    </div>

                    <!-- Playlist Parse Block -->
                    <div id="playlist-area" style="display:none;">
                        <div class="mb-4">
                            <label for="playlist_id" class="form-label"><i class="fa-solid fa-list-check"></i> 歌单ID或链接</label>
                            <input type="text" id="playlist_id" class="form-control" placeholder="输入歌单ID或网易云歌单分享链接">
                        </div>
                        <div class="text-center">
                            <button type="button" id="playlist-btn" class="btn btn-warning btn-modern w-50">
                                <i class="fa-solid fa-layer-group"></i> 解析歌单
                            </button>
                        </div>
                    </div>

                    <!-- Album Parse Block -->
                    <div id="album-area" style="display:none;">
                        <div class="mb-4">
                            <label for="album_id" class="form-label"><i class="fa-solid fa-record-vinyl"></i> 专辑ID或链接</label>
                            <input type="text" id="album_id" class="form-control" placeholder="输入专辑ID或网易云专辑分享链接">
                        </div>
                        <div class="text-center">
                            <button type="button" id="album-btn" class="btn btn-info btn-modern w-50">
                                <i class="fa-solid fa-compact-disc"></i> 解析专辑

    <!-- Essential Scripts -->
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
        $(document).ready(function() {
            // Synchronize custom tab buttons with original #mode-select
            $('.mode-nav-btn').on('click', function() {
                var target = $(this).data('target');
                $('.mode-nav-btn').removeClass('active');
                $(this).addClass('active');
                $('#mode-select').val(target).trigger('change');
            });

            // Keep tab button active state in sync when select changes programmatically
            $('#mode-select').on('change', function() {
                var currentMode = $(this).val();
                $('.mode-nav-btn').removeClass('active');
                $(`.mode-nav-btn[data-target="${currentMode}"]`).addClass('active');
            });

            /* =========================================================
               ORIGINAL PARSING, LORIC & HANDLER LOGIC (100% PRESERVED)
               ========================================================= */

            function lrctrim(lyrics) {
                const lines = lyrics.split('\n');
                const data = [];

                lines.forEach((line, index) => {
                    const matches = line.match(/\[(\d{2}):(\d{2}[\.:]?\d*)]/);
                    if (matches) {
                        const minutes = parseInt(matches[1], 10);
                        const seconds = parseFloat(matches[2].replace('.', ':')) || 0;
                        const timestamp = minutes * 60000 + seconds * 1000;

                        let text = line.replace(/\[\d{2}:\d{2}[\.:]?\d*\]/g, '').trim();
                        text = text.replace(/\s\s+/g, ' '); // Replace multiple spaces with a single space

                        data.push([timestamp, index, text]);
                    }
                });

                data.sort((a, b) => a[0] - b[0]);

                return data;
            }

            function lrctran(lyric, tlyric) {
                lyric = lrctrim(lyric);
                tlyric = lrctrim(tlyric);

                let len1 = lyric.length;
                let len2 = tlyric.length;
                let result = "";

                for (let i = 0, j = 0; i < len1 && j < len2; i++) {
                    while (lyric[i][0] > tlyric[j][0] && j + 1 < len2) {
                        j++;
                    }

                    if (lyric[i][0] === tlyric[j][0]) {
                        tlyric[j][2] = tlyric[j][2].replace('/', '');
                        if (tlyric[j][2]) {
                            lyric[i][2] += ` (翻译：${tlyric[j][2]})`;
                        }
                        j++;
                    }
                }

                for (let i = 0; i < len1; i++) {
                    let t = lyric[i][0];
                    result += `[${String(Math.floor(t / 60000)).padStart(2, '0')}:${String(Math.floor((t % 60000) / 1000)).padStart(2, '0')}.${String(t % 1000).padStart(3, '0')}]${lyric[i][2]}\n`;
                }

                return result;
            }

            function extractLinks(text) {
                var regex = /https?:\/\/\S+/g;
                var matches = text.match(regex);
                if (matches) {
                    return matches[0];
                } else {
                    return '';
                }
            }
    
            function checkValidLink(link) {
                if (link.indexOf("http") === -1 || 
                    (link.indexOf("music.163.com") === -1 && link.indexOf("163cn.tv") === -1)) {
                    return false;
                }
                return true;
            }
    
            function extractAndCheckId(text) {
                var link = extractLinks(text);
                if (checkValidLink(link)) {
                    return link;
                } else {
                    var idRegex = /\b\d+\b/g;
                    var ids = text.match(idRegex);
                    if (ids && ids.length > 0) {
                        return ids[0];
                    }
                    return '';
                }
            }

            // 切换功能区
            $('#mode-select').on('change', function() {
                if ($(this).val() === 'search') {$('#search-area').show();
                    $('#parse-area').hide();
                    $('#playlist-area').hide();
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#song-info').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if ($(this).val() === 'parse') {$('#search-area').hide();
                    $('#parse-area').show();
                    $('#playlist-area').hide();
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#search-result').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if ($(this).val() === 'playlist') {$('#search-area').hide();
                    $('#parse-area').hide();
                    $('#playlist-area').show();
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#search-result').addClass('d-none');
                    $('#song-info').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if ($(this).val() === 'album') {$('#search-area').hide();
                    $('#parse-area').hide();
                    $('#playlist-area').hide();
                    $('#album-area').show();
                    $('#download-area').hide();
                    $('#search-result').addClass('d-none');
                    $('#song-info').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if ($(this).val() === 'download') {$('#search-area').hide();
                    $('#parse-area').hide();
                    $('#playlist-area').hide();
                    $('#album-area').hide();
                    $('#download-area').show();
                    $('#search-result').addClass('d-none');
                    $('#song-info').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else {
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#album-result').addClass('d-none');
                }
            });

            // 搜索功能
            $('#search-btn').on('click', function() {
                const keywords = $('#search_keywords').val();
                const limit = $('#search_limit').val();
                if (!keywords) {
                    alert('请输入搜索关键词');
                    return;
                }
                $.ajax({
                    url: '/Search',
                    method: 'POST',
                    data: { keyword: keywords, limit: limit },
                    dataType: 'json',
                    success: function(data) {
                        if (data.status === 200) {
                            $('#search-list').empty();
                            data.data.forEach(function(song) {
                                const item = `<li class="list-group-item d-flex justify-content-between align-items-center">
                                    <div class="d-flex align-items-center">
                                        <img src="${song.picUrl}" alt="cover" style="width:44px;height:44px;object-fit:cover;border-radius:6px;margin-right:14px;box-shadow:0 2px 6px rgba(0,0,0,0.3);">
                                        <div>
                                            <strong class='song-title'>${song.name}</strong> - <span class="text-white-50">${song.artists}</span> <span class="text-muted small">[${song.album}]</span>
                                        </div>
                                    </div>
                                    <div class="d-flex align-items-center">
                                        <button class="btn btn-sm btn-outline-primary select-song me-2" data-id="${song.id}" data-name="${song.name}"><i class="fa-solid fa-bolt me-1"></i>解析</button>
                                        <button class="btn btn-sm btn-success download-song" data-id="${song.id}" data-name="${song.name}"><i class="fa-solid fa-download me-1"></i>下载</button>
                                    </div>
                                </li>`;
                                $('#search-list').append(item);
                            });
                            $('#search-result').removeClass('d-none');
                        } else {
                            $('#search-list').html('<li class="list-group-item text-center text-muted">未找到相关歌曲</li>');
                            $('#search-result').removeClass('d-none');
                        }
                    },
                    error: function() {
                        $('#search-list').html('<li class="list-group-item text-center text-danger">搜索失败，请重试</li>');
                        $('#search-result').removeClass('d-none');
                    }
                });
            });

            // 搜索结果点击解析
            $(document).on('click', '.select-song', function() {
                const songId = $(this).data('id');$('#song_ids').val(songId);
                $('#mode-select').val('parse').trigger('change');
                $('html,body').animate({scrollTop:$('#main-form').offset().top}, 300);
            });

            // 单曲解析
            $('#parse-btn').on('click', function() {
                const songIds = $('#song_ids').val();
                const level = $('#level').val();
                if (!songIds) {
                    alert('请输入歌曲ID或URL');
                    return;
                }
                $.post('/Song_V1', { url: songIds, level: level, type:'json' }, function(data) {
                    if (data.status === 200) {
                        $('#song_name').text(data.data.name);
                        $('#artist_names').text(data.data.ar_name);
                        $('#song_alname').text(data.data.al_name);
                        $('#song_level').text(data.data.level);
                        $('#song_size').text(data.data.size);
                        let processedLyrics = data.data.lyric;
                        if (data.data.tlyric) {
                            processedLyrics = lrctran(data.data.lyric, data.data.tlyric);
                        }
                        $('#lyric').html(processedLyrics.replace(/\n/g, '<br>'));
                        $('#song_url').attr('href', data.data.url).text('点击下载');
                        $('#song-info').removeClass('d-none');
                        $('#show-big-pic').data('pic', data.data.pic);
                        new APlayer({
                            container: document.getElementById('aplayer'),
                            lrcType: 1,
                            audio: [{
                                name: data.data.name,
                                artist: data.data.ar_name,
                                url: data.data.url,
                                cover: data.data.pic,
                                lrc: processedLyrics
                            }]
                        });
                    } else {
                        alert(data.data.msg);
                    }
                }, 'json');
            });

            // 显示大图按钮事件
            $(document).on('click', '#show-big-pic', function() {
                var picUrl = $(this).data('pic');$('#big-pic-img').attr('src', picUrl);
                var modal = new bootstrap.Modal(document.getElementById('bigPicModal'));
                modal.show();
            });

            // 歌单解析
            $('#playlist-btn').on('click', function() {
                let pid = $('#playlist_id').val().trim();
                if (!pid) {
                    alert('请输入歌单ID或链接');
                    return;
                }
                // 支持直接粘贴歌单链接
                const idMatch = pid.match(/playlist\?id=(\d+)/);
                if (idMatch) pid = idMatch[1];
                $.get('/Playlist', { id: pid }, function(data) {
                    if (data.status === 200) {
                        const pl = data.data.playlist;
                        $('#playlist-cover').attr('src', pl.coverImgUrl);
                        $('#playlist-name').text(pl.name);
                        $('#playlist-creator').text('by ' + pl.creator);
                        $('#playlist-desc').text(pl.description || '');
                        $('#playlist-count').text(pl.trackCount);
                        $('#playlist-tracks').empty();
                        pl.tracks.forEach(function(song, idx) {
                            const item = `<li class="list-group-item d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center">
                                    <img src="${song.picUrl}" alt="cover" style="width:38px;height:38px;object-fit:cover;border-radius:6px;margin-right:12px;box-shadow:0 2px 5px rgba(0,0,0,0.3);">
                                    <div>
                                        <strong class="playlist-title">${idx+1}. ${song.name}</strong> - <span class="text-white-50">${song.artists}</span> <span class="text-muted small">[${song.album}]</span>
                                    </div>
                                </div>
                                <div class="d-flex align-items-center">
                                    <button class="btn btn-sm btn-outline-primary select-song me-2" data-id="${song.id}" data-name="${song.name}"><i class="fa-solid fa-bolt me-1"></i>解析</button>
                                    <button class="btn btn-sm btn-success download-song" data-id="${song.id}" data-name="${song.name}"><i class="fa-solid fa-download me-1"></i>下载</button>
                                </div>
                            </li>`;
                            $('#playlist-tracks').append(item);
                        });
                        $('#playlist-result').removeClass('d-none');
                    } else {
                        $('#playlist-result').removeClass('d-none');
                        $('#playlist-tracks').html('<li class="list-group-item text-danger">歌单解析失败：'+data.data.msg+'</li>');
                    }
                }, 'json');
            });

            // 专辑解析
            $(document).on('click', '#album-btn', function() {
                let aid = $('#album_id').val().trim();
                if (!aid) {
                    alert('请输入专辑ID或链接');
                    return;
                }
                // 支持直接粘贴专辑链接
                const idMatch = aid.match(/album\?id=(\d+)/);
                if (idMatch) aid = idMatch[1];
                $.get('/Album', { id: aid }, function(data) {
                    if (data.status === 200) {
                        const al = data.data.album;
                        $('#album-cover').attr('src', al.coverImgUrl);
                        $('#album-name').text(al.name);
                        $('#album-artist').text(al.artist);
                        $('#album-desc').text(al.description || '');
                        $('#album-count').text(al.songs.length);
                        $('#album-tracks').empty();
                        al.songs.forEach(function(song, idx) {
                            const item = `<li class="list-group-item d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center">
                                    <img src="${song.picUrl}" alt="cover" style="width:38px;height:38px;object-fit:cover;border-radius:6px;margin-right:12px;box-shadow:0 2px 5px rgba(0,0,0,0.3);">
                                    <strong class="playlist-title">${idx+1}. ${song.name}</strong> - <span class="text-white-50">${song.artists}</span> <span class="text-muted small">[${song.album}]</span>
                                </div>
                                <div class="d-flex align-items-center">
                                    <button class="btn btn-sm btn-outline-primary select-song me-2" data-id="${song.id}" data-name="${song.name}"><i class="fa-solid fa-bolt me-1"></i>解析</button>
                                    <button class="btn btn-sm btn-success download-song" data-id="${song.id}" data-name="${song.name}"><i class="fa-solid fa-download me-1"></i>下载</button>
                                </div>
                            </li>`;
                            $('#album-tracks').append(item);
                        });
                        $('#album-result').removeClass('d-none');
                    } else {
                        $('#album-result').removeClass('d-none');
                        $('#album-tracks').html('<li class="list-group-item text-danger">专辑解析失败：'+data.data.msg+'</li>');
                    }
                }, 'json');
            });

            // 音乐下载功能
            $('#download-btn').on('click', function() {
                const musicId = $('#download_id').val().trim();
                const quality = $('#download_quality').val();
                
                if (!musicId) {
                    alert('请输入音乐ID或URL');
                    return;
                }
                
                // 提取ID（支持URL格式）
                let processedId = musicId;
                const idMatch = musicId.match(/song\?id=(\d+)/);
                if (idMatch) {
                    processedId = idMatch[1];
                }
                
                // 显示进度条
                $('#download-progress').removeClass('d-none');
                $('#download-btn').prop('disabled', true).html('<i class="fa-solid fa-spinner fa-spin me-2"></i>下载中...');
                
                // 使用XMLHttpRequest来处理下载并获取响应头
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/Download', true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                xhr.responseType = 'blob';
                
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        // 获取自定义响应头
                        const downloadMessage = xhr.getResponseHeader('X-Download-Message');
                        const encodedFilename = xhr.getResponseHeader('X-Download-Filename');
                        const filename = encodedFilename ? decodeURIComponent(encodedFilename) : 'music.flac';
                        
                        // 创建下载链接
                        const blob = xhr.response;
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename || 'music.flac';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                        
                        // 显示完成提示
                        alert('✅ 音乐文件下载完成！');
                        console.log(`下载完成: ${filename}`);
                        if (downloadMessage) {
                            console.log(`服务器消息: ${downloadMessage}`);
                        }
                    } else {
                        alert('下载失败，请重试');
                    }
                    
                    // 重置按钮状态
                    $('#download-progress').addClass('d-none');
                    $('#download-btn').prop('disabled', false).html('<i class="fa-solid fa-arrow-down-to-line me-1"></i>下载音乐');
                };
                
                xhr.onerror = function() {
                    alert('下载出错，请重试');
                    $('#download-progress').addClass('d-none');
                    $('#download-btn').prop('disabled', false).html('<i class="fa-solid fa-arrow-down-to-line me-1"></i>下载音乐');
                };
                
                // 发送请求
                const formData = `id=${encodeURIComponent(processedId)}&quality=${encodeURIComponent(quality)}`;
                xhr.send(formData);
            });

            // 列表中的下载按钮点击事件
            // 下载按钮点击跳转到下载功能
            $(document).on('click', '.download-song', function() {
                const musicId = $(this).data('id');
                const songName = $(this).data('name');
                
                if (!musicId) {
                    alert('无法获取音乐ID');
                    return;
                }
                
                // 填充下载ID并跳转到下载功能区域
                $('#download_id').val(musicId);
                $('#mode-select').val('download').trigger('change');
                $('html,body').animate({scrollTop:$('#main-form').offset().top}, 300);
            });
        });
    </script>
</body>
</html>
